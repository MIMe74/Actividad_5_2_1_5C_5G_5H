<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actividad 5.2.1 · Torneo de piedra, papel o tijeras</title>
<style>
:root{--ink:#241a2e;--mag:#b3306d;--rose:#f7e4ee;--paper:#fffafc;--gold:#e0a526;--ok:#23805f;--bad:#c0392b;--line:#e5c7d6}
*{box-sizing:border-box}
body{margin:0;background:var(--rose);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{border-left:10px solid var(--mag);padding:6px 0 6px 14px;margin-bottom:16px}
header small{color:var(--mag);font-weight:600}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:.2em 0 .4em}
h1{font-size:1.7rem}
#stage{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px}
.sub{color:#6a5a74;margin-top:0}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:12px;padding:11px 20px;background:var(--mag);color:#fff}
button.alt{background:#fff;color:var(--mag);border:2px solid var(--mag)}
.hands{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.hands button{flex:1;min-width:120px;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1rem;padding:14px 8px}
.hands button span{display:block;font-size:2.6rem;line-height:1.1}
.hands button:hover{border-color:var(--mag);background:var(--rose)}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;background:var(--ink);color:#fff;border-radius:14px;padding:14px;margin:12px 0}
.board b{display:block;font-size:2.4rem;font-family:Georgia,serif}
.board .who{font-size:.9rem;opacity:.85}
.mid{font-size:.9rem;color:var(--gold)}
ul.log{list-style:none;padding:0;margin:8px 0}
ul.log li{padding:6px 10px;border-radius:8px;margin:4px 0;background:#fff;border:1px solid var(--line)}
li.w{border-left:6px solid var(--ok)}li.l{border-left:6px solid var(--bad)}li.t{border-left:6px solid var(--gold)}
.msg{padding:12px 14px;border-radius:12px;background:var(--rose);font-weight:600;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin:6px 0 16px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--rose)}
tr.me{background:#fff3cf;font-weight:700}tr.q td:first-child{border-left:5px solid var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 18px}
.place{text-align:center;padding:18px;border-radius:16px;background:var(--ink);color:#fff;margin:10px 0}
.place b{display:block;font-family:Georgia,serif;font-size:3.4rem;color:var(--gold);line-height:1}
.pair{display:flex;justify-content:space-between;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;margin:6px 0}
.pair.me{background:#fff3cf;border-color:var(--gold)}
label{font-weight:600;display:block;margin:14px 0 4px}
@media print{button,.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<main>
<header><small>Progresión 5 · Aplicaciones del pensamiento matemático</small><h1>Actividad 5.2.1 · Torneo de piedra, papel o tijeras</h1></header>
<div id="stage"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const EM=['✊','✋','✌️'],NM=['Piedra','Papel','Tijeras'];
const beats=(a,b)=>(a-b+3)%3===1;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R3=()=>Math.floor(Math.random()*3);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const CPU=['Ana','Luis','Marco','Sofía','Diego','Valeria','Iván','Camila','Raúl','Paola','Héctor','Daniela','Omar','Lucía','Tomás'];
const STG=['Fase de grupos','Cuartos de final','Semifinal','Final (subcampeón/a)','Campeón/a'];
const RN=['Cuartos de final','Semifinal','Final'];
let S,P,M;

function intro(){
 $('#stage').innerHTML=`<h2>Reglas del torneo</h2>
 <p class="sub">Participas con 15 jugadores más, repartidos en 4 grupos de 4. Tú estás en el Grupo A.</p>
 <ul>
 <li><b>Fase de grupos:</b> juegas un partido contra cada integrante de tu grupo. Un partido son 4 enfrentamientos seguidos. Victoria +3, empate +1, derrota 0. Avanzan los 2 con más puntos.</li>
 <li><b>Eliminatorias:</b> sorteo aleatorio por pares. Cada enfrentamiento es a 5 partidas; quien gane menos, queda eliminado (si hay empate, se juega una partida extra).</li>
 <li><b>Final:</b> los 2 mejores juegan 5 partidas. Si ganas, tu grupo original recibe la recompensa del docente.</li>
 </ul>
 <label for="nm">Nombre completo (apellido paterno, materno y nombre/s)</label>
 <input id="nm" autocomplete="name" placeholder="Ej. Pérez López Ana María">
 <p id="err" style="color:var(--bad);min-height:1.4em;margin:6px 0"></p>
 <button id="go">Comenzar torneo</button>`;
 $('#go').onclick=()=>{
  const n=$('#nm').value.trim().replace(/\s+/g,' ');
  if(n.split(' ').length<2||n.length<5){$('#err').textContent='Escribe tu nombre completo (al menos dos palabras).';return}
  start(n)};
}
function start(n){
 const names=shuf(CPU);
 P=[{n,g:0}].concat(names.map((x,i)=>({n:x,g:Math.floor((i+1)/4)})));
 P.forEach(p=>Object.assign(p,{pts:0,w:0,ew:0,stage:0,j:Math.random()}));
 S={name:n,gi:0,r:0,alive:[]};
 S.opps=P.filter((p,i)=>p.g===0&&i!==0).map(p=>P.indexOf(p));
 groupStep();
}
function groupStep(){
 if(S.gi<3){const o=S.opps[S.gi];
  startMatch({kind:'group',opp:o,n:4,title:`Fase de grupos · Partido ${S.gi+1} de 3`,next:()=>{S.gi++;groupStep()}});
 } else groupsDone();
}
function startMatch(o){M=Object.assign({r:0,a:0,b:0,log:[],done:false},o);drawMatch()}
function pick(c){
 if(M.done)return;
 const k=R3(),res=c===k?0:beats(c,k)?1:-1;
 M.r++;if(res>0)M.a++;if(res<0)M.b++;
 M.log.push({c,k,res});
 if(M.kind==='group'?M.r>=M.n:(M.r>=M.n&&M.a!==M.b)){
  M.done=true;
  if(M.kind==='group')applyG(0,M.opp,M.a,M.b);
 }
 drawMatch();
}
function applyG(i,j,a,b){
 P[i].pts+=a>b?3:a===b?1:0;P[j].pts+=b>a?3:a===b?1:0;P[i].w+=a;P[j].w+=b;
}
function drawMatch(){
 const m=M,opp=esc(P[m.opp].n),sd=m.kind==='elim'&&m.r>=m.n&&!m.done;
 let h=`<h2>${m.title}</h2><p class="sub">${m.kind==='group'?'Partido de 4 enfrentamientos contra':'Enfrentamiento a 5 partidas contra'} <b>${opp}</b></p>
 <div class="board"><div><span class="who">Tú</span><b>${m.a}</b></div><div class="mid">${sd?'Partida extra':'Partida '+Math.min(m.r+(m.done?0:1),Math.max(m.n,m.r))+' de '+m.n}</div><div><span class="who">${opp}</span><b>${m.b}</b></div></div>`;
 h+='<ul class="log">'+m.log.map((x,i)=>`<li class="${x.res>0?'w':x.res<0?'l':'t'}">Partida ${i+1}: tú ${EM[x.c]} ${NM[x.c]} · ${opp} ${EM[x.k]} ${NM[x.k]} → <b>${x.res>0?'Ganaste':x.res<0?'Perdiste':'Empate'}</b></li>`).join('')+'</ul>';
 if(!m.done){
  h+=`<p><b>${sd?'Empate: desempata con una partida extra.':'Elige tu jugada:'}</b></p><div class="hands">`+NM.map((x,i)=>`<button onclick="pick(${i})"><span>${EM[i]}</span>${x}</button>`).join('')+'</div>';
 }else{
  let t;
  if(m.kind==='group')t=m.a>m.b?'Victoria: +3 puntos':m.a===m.b?'Empate: +1 punto':'Derrota: 0 puntos';
  else t=m.a>m.b?'¡Ganaste el enfrentamiento y avanzas!':'Perdiste el enfrentamiento y quedas eliminado/a.';
  h+=`<div class="msg">${t}</div><button id="nx">Continuar</button>`;
 }
 $('#stage').innerHTML=h;
 if(m.done)$('#nx').onclick=()=>m.next();
}
function standing(g){return P.filter(p=>p.g===g).sort((a,b)=>b.pts-a.pts||b.w-a.w||b.j-a.j)}
function groupsDone(){
 for(let g=0;g<4;g++){
  const ids=P.map((p,i)=>i).filter(i=>P[i].g===g);
  for(let x=0;x<ids.length;x++)for(let y=x+1;y<ids.length;y++){
   if(ids[x]===0||ids[y]===0)continue;
   let a=0,b=0;for(let r=0;r<4;r++){const z=R3();if(z===0)a++;if(z===1)b++}
   applyG(ids[x],ids[y],a,b);
  }
 }
 const q=[];
 for(let g=0;g<4;g++)standing(g).slice(0,2).forEach(p=>{p.stage=1;q.push(P.indexOf(p))});
 S.alive=shuf(q);
 let h='<h2>Resultados de la fase de grupos</h2><div class="grid">';
 for(let g=0;g<4;g++){
  h+=`<div><h3>Grupo ${'ABCD'[g]}</h3><table><tr><th>#</th><th>Jugador</th><th>Pts</th></tr>`+standing(g).map((p,i)=>`<tr class="${p===P[0]?'me':''} ${i<2?'q':''}"><td>${i+1}</td><td>${esc(p===P[0]?p.n+' (tú)':p.n)}</td><td>${p.pts}</td></tr>`).join('')+'</table></div>';
 }
 h+='</div><p class="sub">Marcados en verde: los 2 jugadores de cada grupo que avanzan.</p>';
 if(P[0].stage>=1)h+=`<div class="msg">¡Clasificaste a las eliminatorias!</div><button id="nx">Ir al sorteo</button>`;
 else h+=`<div class="msg">No clasificaste: ganar enfrentamientos individuales no basta si otros suman más puntos.</div><button id="nx">Ver clasificación final</button>`;
 $('#stage').innerHTML=h;
 $('#nx').onclick=P[0].stage>=1?elimRound:()=>{finishAll();results()};
}
function pairs(){const a=S.alive,p=[];for(let i=0;i<a.length;i+=2)p.push([a[i],a[i+1]]);return p}
function elimRound(){
 const pr=pairs(),mine=pr.find(p=>p.includes(0));
 let h=`<h2>${RN[S.r]} · Sorteo</h2><p class="sub">Los emparejamientos se sortearon al azar.</p>`+
 pr.map(p=>`<div class="pair ${p.includes(0)?'me':''}"><span>${esc(P[p[0]].n)}${p[0]===0?' (tú)':''}</span><b>vs</b><span>${esc(P[p[1]].n)}${p[1]===0?' (tú)':''}</span></div>`).join('')+
 '<p></p><button id="nx">Jugar mi enfrentamiento</button>';
 $('#stage').innerHTML=h;
 const opp=mine.find(x=>x!==0);
 $('#nx').onclick=()=>startMatch({kind:'elim',opp,n:5,title:RN[S.r],next:()=>{
  const win=M.a>M.b;P[0].ew+=M.a;P[opp].ew+=M.b;
  resolve(S.r,win,opp);S.r++;
  if(!win||S.r>=3){finishAll();results()}else roundSummary();
 }});
}
function simElim(i,j){
 let a=0,b=0,r=0;
 do{r++;const z=R3();if(z===0)a++;if(z===1)b++}while(r<5||a===b);
 P[i].ew+=a;P[j].ew+=b;return a>b?i:j;
}
function resolve(r,sw,opp){
 const w=[];
 pairs().forEach(p=>{
  const x=p.includes(0)?(sw?0:p.find(v=>v!==0)):simElim(p[0],p[1]);
  P[x].stage=r+2;w.push(x);
 });
 S.alive=w;
}
function finishAll(){while(S.r<3){resolve(S.r,null);S.r++}}
function roundSummary(){
 $('#stage').innerHTML=`<h2>Avanzas a: ${RN[S.r]}</h2><p class="sub">Jugadores que siguen en el torneo:</p>`+
 S.alive.map(i=>`<div class="pair ${i===0?'me':''}">${esc(P[i].n)}${i===0?' (tú)':''}</div>`).join('')+'<p></p><button id="nx">Continuar al sorteo</button>';
 $('#nx').onclick=elimRound;
}
function results(){
 const sorted=P.slice().sort((a,b)=>b.stage-a.stage||b.pts-a.pts||b.ew-a.ew||b.j-a.j);
 const place=sorted.indexOf(P[0])+1,st=P[0].stage;
 let h=`<h2>Resultados del torneo</h2><div class="place"><span>${esc(S.name)}</span><b>${place}.º lugar</b>Etapa alcanzada: ${STG[st]} · Puntos en fase de grupos: ${P[0].pts}</div>`;
 if(st===4)h+='<div class="msg">¡Eres el campeón! Tu grupo original recibe la recompensa ofrecida por el docente.</div>';
 else if(st===3)h+='<div class="msg">Llegaste a la final. Estuviste a una victoria de la recompensa para tu grupo.</div>';
 h+='<h3>Clasificación general</h3><table><tr><th>Lugar</th><th>Jugador</th><th>Etapa</th><th>Pts grupo</th></tr>'+
 sorted.map((p,i)=>`<tr class="${p===P[0]?'me':''}"><td>${i+1}</td><td>${esc(p===P[0]?p.n+' (tú)':p.n)}</td><td>${STG[p.stage]}</td><td>${p.pts}</td></tr>`).join('')+'</table>'+
 '<p class="sub">El lugar se asigna por la etapa alcanzada; a igualdad de etapa, por puntos de la fase de grupos y luego por partidas ganadas en eliminatorias.</p>'+
 `<h3>Preguntas de reflexión</h3><p class="sub">Responde con base en lo que viviste en el torneo.</p>`+
 [['a','¿Un jugador puede ganar enfrentamientos individuales y aun así no clasificar a la fase eliminatoria? Explica cómo es posible.'],
 ['b','Explica una situación en la que empatar un partido pudo ser más beneficioso que ganarlo.'],
 ['c','Si 2 jugadores del mismo grupo llegaron a la final, ¿qué pasa con este enfrentamiento?'],
 ['d','¿Por qué una decisión tomada en un partido de la fase de grupos puede afectar a compañeros que ya no juegan contra ti?'],
 ['e','Considerando que la recompensa del torneo beneficia también a quienes enfrentaron al ganador en la fase de grupos, ¿qué relación se genera entre los jugadores del mismo grupo?'],
 ['f','¿Hay alguna estrategia ganadora que se pueda aplicar durante la fase de grupos que maximice las oportunidades de que un grupo específico gane el torneo?']]
 .map(q=>`<label for="q${q[0]}">${q[0]}. ${q[1]}</label><textarea id="q${q[0]}" rows="3"></textarea>`).join('')+
 '<p class="noprint"><button onclick="window.print()">Imprimir o guardar en PDF</button> <button class="alt" onclick="intro()">Jugar de nuevo</button></p>';
 $('#stage').innerHTML=h;
}
intro();
</script>
</body>
</html>
